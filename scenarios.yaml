target_language: japanese
target_language_code: ja
native_language: 繁體中文
native_language_code: zh-TW
sentences_per_scenario: 12

scenarios:
  - id: restaurant_full
    title: 在餐廳吃飯
    context: 在日式餐廳從入座、確認預約、點餐、加點到結帳的完整流程
    roles:
      you: 顧客
      other: 店員

  - id: cafe_order
    title: 在咖啡廳點餐
    context: 你走進一家日式咖啡廳，要點一杯飲料跟甜點
    roles:
      you: 顧客
      other: 店員

  - id: ramen_shop
    title: 拉麵店用餐
    context: 在日本拉麵店排隊、買食券、調整麵硬度、加點配料、吃完後說謝謝招待
    roles:
      you: 顧客
      other: 店員

  - id: izakaya_with_friends
    title: 居酒屋和朋友點餐
    context: 跟日本朋友到居酒屋，想點飲料、小菜、烤物，也要自然地請店員推薦
    roles:
      you: 顧客
      other: 店員

  - id: convenience_store_payment
    title: 便利商店付款
    context: 在便利商店買東西，處理袋子、加熱便當、刷卡、集點和收據
    roles:
      you: 顧客
      other: 店員

  - id: train_station_help
    title: 車站問路與轉乘
    context: 在日本車站找不到月台，想確認路線、轉乘、末班車和是否需要補票
    roles:
      you: 旅客
      other: 站務員

  - id: hotel_checkin
    title: 飯店入住
    context: 到飯店 check-in，確認訂房、寄放行李、早餐時間、Wi-Fi 和退房時間
    roles:
      you: 住客
      other: 櫃台人員

  - id: city_office_return_home
    title: 區役所辦理轉出歸國
    context: 去區役所辦理海外轉出，說明即將歸國，確認轉出届、國民健康保險、My Number 和相關手續
    roles:
      you: 居民
      other: 區役所職員

  - id: pharmacy_symptoms
    title: 藥局買感冒藥
    context: 到藥局描述喉嚨痛、鼻塞、咳嗽，詢問非處方藥和服用方式
    roles:
      you: 顧客
      other: 藥師

  - id: phone_reservation
    title: 打電話預約餐廳
    context: 用電話預約餐廳，確認日期、時間、人數、名字、電話和是否有禁菸座位
    roles:
      you: 顧客
      other: 店員

  - id: work_meeting
    title: 工作會議開場
    context: 跟日本同事的線上週會，輪到你 update 進度
    roles:
      you: 工程師
      other: 主管

  - id: work_status_blocker
    title: 工作進度與卡關回報
    context: 在 standup 中說明昨天完成的事、今天計畫、目前卡住的問題，並請同事協助
    roles:
      you: 工程師
      other: 同事

  - id: ask_directions
    title: 問路
    context: 在東京街頭迷路，找最近的車站
    roles:
      you: 觀光客
      other: 路人

  - id: doctor_visit
    title: 看醫生
    context: 感冒喉嚨痛，到診所跟醫生描述症狀
    roles:
      you: 病患
      other: 醫生

  - id: small_talk
    title: 同事閒聊
    context: 茶水間遇到同事，聊週末
    roles:
      you: 你
      other: 同事
